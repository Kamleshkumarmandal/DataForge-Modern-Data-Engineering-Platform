[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge-platform"
version = "0.1.0"
description = "A reproducible batch data engineering and pipeline observability platform"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2,<4.0",
  "pyarrow>=17,<25",
  "duckdb>=1.1,<2.0",
]

[project.scripts]
dataforge = "dataforge.cli:main"

[tool.setuptools.packages.find]
include = ["dataforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
